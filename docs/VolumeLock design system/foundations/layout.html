<html lang="es"><head><meta charset="utf-8"><title>Forma y espacio</title>

<style>body{padding:24px}h2{font:var(--md-title-medium);letter-spacing:var(--md-tracking-title-medium);margin:0 0 12px}</style>
</head><body>
<h2>Escala de espaciado</h2>
<div style="display:flex;align-items:flex-end;gap:12px;margin-bottom:24px">
<div style="text-align:center"><div style="width:var(--md-space-1);height:var(--md-space-1);background:var(--md-primary);border-radius:2px"></div><div style="font:var(--md-label-small);color:var(--md-on-surface-variant);margin-top:4px">4</div></div><div style="text-align:center"><div style="width:var(--md-space-2);height:var(--md-space-2);background:var(--md-primary);border-radius:2px"></div><div style="font:var(--md-label-small);color:var(--md-on-surface-variant);margin-top:4px">8</div></div><div style="text-align:center"><div style="width:var(--md-space-3);height:var(--md-space-3);background:var(--md-primary);border-radius:2px"></div><div style="font:var(--md-label-small);color:var(--md-on-surface-variant);margin-top:4px">12</div></div><div style="text-align:center"><div style="width:var(--md-space-4);height:var(--md-space-4);background:var(--md-primary);border-radius:2px"></div><div style="font:var(--md-label-small);color:var(--md-on-surface-variant);margin-top:4px">16</div></div><div style="text-align:center"><div style="width:var(--md-space-5);height:var(--md-space-5);background:var(--md-primary);border-radius:2px"></div><div style="font:var(--md-label-small);color:var(--md-on-surface-variant);margin-top:4px">20</div></div><div style="text-align:center"><div style="width:var(--md-space-6);height:var(--md-space-6);background:var(--md-primary);border-radius:2px"></div><div style="font:var(--md-label-small);color:var(--md-on-surface-variant);margin-top:4px">24</div></div><div style="text-align:center"><div style="width:var(--md-space-8);height:var(--md-space-8);background:var(--md-primary);border-radius:2px"></div><div style="font:var(--md-label-small);color:var(--md-on-surface-variant);margin-top:4px">32</div></div><div style="text-align:center"><div style="width:var(--md-space-10);height:var(--md-space-10);background:var(--md-primary);border-radius:2px"></div><div style="font:var(--md-label-small);color:var(--md-on-surface-variant);margin-top:4px">40</div></div><div style="text-align:center"><div style="width:var(--md-space-12);height:var(--md-space-12);background:var(--md-primary);border-radius:2px"></div><div style="font:var(--md-label-small);color:var(--md-on-surface-variant);margin-top:4px">48</div></div><div style="text-align:center"><div style="width:var(--md-space-16);height:var(--md-space-16);background:var(--md-primary);border-radius:2px"></div><div style="font:var(--md-label-small);color:var(--md-on-surface-variant);margin-top:4px">64</div></div>
</div>
<h2>Forma</h2>
<div style="display:flex;gap:12px;margin-bottom:24px">
<div style="flex:1;height:88px;border:1px solid var(--md-outline-variant);background:var(--md-surface-container);border-radius:var(--md-shape-xs);display:flex;align-items:center;justify-content:center;text-align:center;font:var(--md-label-medium);color:var(--md-on-surface-variant);padding:8px">4 · chips</div><div style="flex:1;height:88px;border:1px solid var(--md-outline-variant);background:var(--md-surface-container);border-radius:var(--md-shape-sm);display:flex;align-items:center;justify-content:center;text-align:center;font:var(--md-label-medium);color:var(--md-on-surface-variant);padding:8px">8 · barras</div><div style="flex:1;height:88px;border:1px solid var(--md-outline-variant);background:var(--md-surface-container);border-radius:var(--md-shape-md);display:flex;align-items:center;justify-content:center;text-align:center;font:var(--md-label-medium);color:var(--md-on-surface-variant);padding:8px">12 · tarjetas</div><div style="flex:1;height:88px;border:1px solid var(--md-outline-variant);background:var(--md-surface-container);border-radius:var(--md-shape-lg);display:flex;align-items:center;justify-content:center;text-align:center;font:var(--md-label-medium);color:var(--md-on-surface-variant);padding:8px">16</div><div style="flex:1;height:88px;border:1px solid var(--md-outline-variant);background:var(--md-surface-container);border-radius:var(--md-shape-xl);display:flex;align-items:center;justify-content:center;text-align:center;font:var(--md-label-medium);color:var(--md-on-surface-variant);padding:8px">28 · bloque de estado</div><div style="flex:1;height:88px;border:1px solid var(--md-outline-variant);background:var(--md-surface-container);border-radius:var(--md-shape-full);display:flex;align-items:center;justify-content:center;text-align:center;font:var(--md-label-medium);color:var(--md-on-surface-variant);padding:8px">pastilla · botones</div>
</div>
<h2>Objetivo táctil</h2>
<div style="display:flex;align-items:center;gap:16px">
<div style="width:48px;height:48px;border:1px dashed var(--md-error);border-radius:8px;display:flex;align-items:center;justify-content:center"><div style="width:16px;height:16px;background:var(--md-primary);border-radius:99px"></div></div>
<p style="font:var(--md-body-medium);color:var(--md-on-surface-variant);max-width:60ch;margin:0">48dp mínimo, sin excepciones. La barra de un slider mide 16dp pero su zona activa ocupa los 48dp completos. Margen lateral de pantalla: 16dp.</p>
</div>
